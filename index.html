function sweep(){try{if(!ac)return;const o=ac.createOscillator(),g=ac.createGain();o.type='square';o.frequency.setValueAtTime(500,ac.currentTime);o.frequency.exponentialRampToValueAtTime(2000,ac.currentTime+.22);g.gain.value=.05;g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+.25);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.25)}catch(e){}}
function pop(t){const p=$('pop');p.textContent=t;p.style.opacity=1;clearTimeout(pop.t);pop.t=setTimeout(()=>p.style.opacity=0,700)}
function start(){for(const c of cars)scene.remove(c);for(const c of coins)scene.remove(c);cars.length=0;coins.length=0;Object.assign(S,{m:'play',v:30,x:0,tx:0,score:0,coins:0,shield:save.s,spawn:1,cs:2});shake=0;paused=false;birdAt=performance.now()+R(4000,9000);$('mp').style.display='none';$('ui').classList.add('hide');$('lh').classList.remove('hide');eng(true)}
function over(){S.m='over';eng(false);shake=1;lh.hold=false;bird.style.display='none';$('lh').classList.add('hide');save.c+=S.coins;save.best=Math.max(save.best,Math.floor(S.score));store();$('msg').textContent='Crash! Score '+Math.floor(S.score)+' (+'+S.coins+' Münzen)';$('go').textContent='NOCHMAL';shop();setTimeout(()=>$('ui').classList.remove('hide'),900)}
$('go').onclick=start;
const mv=e=>{if(e.target.closest&&e.target.closest('#mp,#mb,#lh,#cu'))return;S.tx=(e.clientX/innerWidth*2-1)*5.5};addEventListener('pointermove',mv);addEventListener('pointerdown',mv);
addEventListener('keydown',e=>{if(e.target.tagName=='INPUT')return;if(e.key=='ArrowLeft')S.tx=Math.max(-5.2,S.tx-1.5);if(e.key=='ArrowRight')S.tx=Math.min(5.2,S.tx+1.5)});
addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix()});
const dayC=new THREE.Color(0x7ec8ff),nightC=new THREE.Color(0x060a1f),duskC=new THREE.Color(0xff8a5c),sunC1=new THREE.Color(0xfff2b0),sunC2=new THREE.Color(0xff6a1a),moonC=new THREE.Color(0x8fa8ff),gDay=new THREE.Color(0x334455),gDusk=new THREE.Color(0x6a3b2a),sky=new THREE.Color(),clock=new THREE.Clock();
function loop(){requestAnimationFrame(loop);const dt=paused?(clock.getDelta(),0):Math.min(clock.getDelta(),.05);S.t+=dt;const play=S.m=='play';
if(play){S.v=Math.min(95*TOP(),S.v+dt*1.3*ACC());S.x+=(S.tx-S.x)*Math.min(1,(5+save.h*1.5)*dt);S.x=Math.max(-5.2,Math.min(5.2,S.x));S.score+=S.v*dt*.2*SM();
 S.spawn-=dt;if(S.spawn<=0){S.spawn=Math.max(.3,1.1-S.v/110)*R(.8,1.3);const free=lanes.filter(x=>!cars.some(o=>o.position.x==x&&o.position.z<-150));if(free.length){const c=mkCar();c.position.set(free[Math.floor(Math.random()*free.length)],0,-160);c.userData.sp=CAR_SPEED;scene.add(c);cars.push(c)}}
 S.cs-=dt;if(S.cs<=0){S.cs=R(2,4);const x=lanes[Math.floor(Math.random()*4)];for(let i=0;i<5;i++){const c=new THREE.Mesh(cg,cm);c.position.set(x,1,-160-i*4);scene.add(c);coins.push(c)}}
}else if(S.m=='over')S.v=Math.max(0,S.v-dt*40);else S.v=25;
const d=S.v*dt;
for(const m of marks){m.position.z+=d;if(m.position.z>10)m.position.z-=360}
for(const c of cones){c.position.z+=d;if(c.position.z>10)c.position.z-=350}
for(const b of bl){b.position.z+=d;if(b.position.z>20){b.position.z-=320;b.position.x=Math.sign(b.position.x)*R(11,25)}}
for(const t of trees){t.position.z+=d;if(t.position.z>10){t.position.z-=360;t.position.x=Math.sign(t.position.x)*R(7.5,10.5)}}
for(const l of lamps){l.position.z+=d;if(l.position.z>10)l.position.z-=360}
for(const m of streaks){m.position.z+=d*1.4;m.scale.z=1+S.v/40;if(m.position.z>10){m.position.z=R(-70,-40);m.position.x=R(-6,6);m.position.y=R(.3,4)}}
streakM.opacity=cl((S.v-45)/70,0,.45);
for(let i=cars.length-1;i>=0;i--){const c=cars[i],pz=c.position.z;c.position.z+=(S.v-c.userData.sp)*dt;if(c.userData.cone)c.rotation.z=Math.sin(S.t*10+c.position.x)*.15;
 if(play){if(Math.max(pz,c.position.z)>-2.8&&Math.min(pz,c.position.z)<2.8&&Math.abs(c.position.x-S.x)<1.3){scene.remove(c);cars.splice(i,1);if(S.shield>0){S.shield--;shake=.6;pop('Schild!');beep(200)}else over();continue}
 else if(!c.userData.p&&c.position.z>2.8){c.userData.p=1;if(Math.abs(c.position.x-S.x)<2.4){S.score+=50*SM();pop('Knapp! +'+50*SM());beep(800)}}}
 if(c.position.z>15){scene.remove(c);cars.splice(i,1)}}
for(let i=coins.length-1;i>=0;i--){const c=coins[i],pz=c.position.z;c.position.z+=d;c.rotation.y+=dt*4;
 if(play){if(Math.hypot(c.position.x-S.x,c.position.z)<2+save.m*2.5)c.position.x+=(S.x-c.position.x)*Math.min(1,dt*8);
 if(Math.max(pz,c.position.z)>-1.4&&Math.min(pz,c.position.z)<1.4&&Math.abs(c.position.x-S.x)<1.1){S.coins++;S.score+=5*SM();beep(1200);scene.remove(c);coins.splice(i,1);continue}}
 if(c.position.z>10){scene.remove(c);coins.splice(i,1)}}
bike.position.x=S.x;lean.rotation.z=Math.max(-.5,Math.min(.5,(S.x-S.tx)*.12));for(const w of wheels)w.rotation.x-=S.v*dt*2.5;
lh.t+=dt;const lon=(lh.hold||lh.t<.4)&&play;lh.k+=((lon?1:0)-lh.k)*Math.min(1,dt*14);
const pulse=.75+.25*Math.sin(S.t*45);
if(cu.lh)tmpC.set(cu.lh);else tmpC.setHSL((S.t*2)%1,1,.6);
beamM.color.copy(tmpC);coreM.color.copy(tmpC).lerp(white,.6);spot.color.copy(tmpC);flare.material.color.copy(tmpC).lerp(white,.4);
beamM.opacity=.5*lh.k*pulse;coreM.opacity=.85*lh.k*pulse;spot.intensity=2500*lh.k*pulse;flare.material.opacity=lh.k;
const fl=$('fl');fl.style.opacity=.55*lh.k*pulse;if(lh.k>.02)fl.style.background='radial-gradient(circle at 50% 72%, #'+tmpC.getHexString()+', transparent 65%)';
if(lon&&dt>0){lh.snd-=dt;if(lh.snd<=0){sweep();lh.snd=.25}for(let j=0;j<3;j++)spawnConf(S.x)}
for(let i=0;i<NC;i++){if(cLife[i]>0){cLife[i]-=dt;cp[i*3]+=cvl[i*3]*dt;cp[i*3+1]+=cvl[i*3+1]*dt;cp[i*3+2]+=cvl[i*3+2]*dt;cvl[i*3+1]-=6*dt;if(cLife[i]<=0)cp[i*3+1]=-100}}
cGeo.attributes.position.needsUpdate=true;cGeo.attributes.color.needsUpdate=true;
const cx=S.x*.6;shake*=.9;cam.position.set(cx+R(-shake,shake)*.3,3.6+R(-shake,shake)*.3,8);cam.lookAt(cx*.9,1.2,-12);cam.fov=Math.min(100,68+(S.v-30)*.25);cam.updateProjectionMatrix();
const n=(Math.sin(S.t*.05)+1)/2,elev=1-n*1.6,low=1-cl(elev,0,1),dusk=Math.max(0,1-Math.abs(elev)*3);
sky.copy(dayC).lerp(nightC,n).lerp(duskC,dusk*.55);scene.background=sky;scene.fog.color.copy(sky);
hemi.color.copy(sky).lerp(white,.55);hemi.groundColor.copy(gDay).lerp(gDusk,dusk*.7);hemi.intensity=1.0-.7*n;
sun.intensity=1.4-1.05*n;sun.color.copy(white).lerp(sunC2,low*.55).lerp(moonC,cl(n*1.2-.2,0,1));sun.position.set(14,10+16*cl(elev,.1,1),8);hl.intensity=n*260;
sunDisc.position.set(30,-10+elev*85,-260);sunGlow.position.copy(sunDisc.position);sunDisc.material.color.copy(sunC1).lerp(sunC2,low);sunGlow.material.opacity=cl((elev+.4)*1.5,0,1);
moon.position.set(-45,-10-elev*85,-260);starMat.opacity=cl((n-.5)*2.2,0,1);lampMat.emissiveIntensity=.2+1.6*n;lampGlowMat.opacity=n*.9;
for(let i=0;i<clouds.length;i++){const c=clouds[i];c.position.x+=dt*(1.5+i*.1);if(c.position.x>160)c.position.x=-160;c.material.color.setScalar(1-.7*n)}
$('vg').style.opacity=.35+cl((S.v-30)/120,0,.5);
if(osc)osc.frequency.value=50+S.v*2.2;
$('hud').textContent=play?'Score '+Math.floor(S.score)+'\n'+Math.round(S.v*3.2)+' km/h | Münzen '+S.coins+(S.shield?' | Schild x'+S.shield:'')+(save.cx?' | CODE':''):'';
ren.render(scene,cam)}
loop();
</script></body></html>
